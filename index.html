const MBar=({l,v,g,col})=>{
  const pct=Math.min(100,Math.round(v/g*100)),over=v>g;
  return <div style={{marginBottom:7}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
      <span style={{fontSize:11,color:C.mt}}>{l}</span>
      <span style={{fontSize:11}}><b style={{color:over?"#fb923c":col}}>{Math.round(v)}</b><span style={{color:C.mt}}>/{g}g</span></span>
    </div>
    <div style={{height:5,background:"#1e293b",borderRadius:3,overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",background:over?"#fb923c":col,borderRadius:3,transition:"width .3s"}}/>
    </div>
  </div>;
};

const Ring=({v,g})=>{
  const pct=Math.min(1,v/g),r=38,ci=2*Math.PI*r;
  const col=v>g?"#fb923c":v/g>0.85?"#4ade80":"#60a5fa";
  return <div style={{position:"relative",width:84,height:84,flexShrink:0}}>
    <svg width={84} height={84} style={{transform:"rotate(-90deg)"}}>
      <circle cx={42} cy={42} r={r} fill="none" stroke="#1e293b" strokeWidth={7}/>
      <circle cx={42} cy={42} r={r} fill="none" stroke={col} strokeWidth={7}
        strokeDasharray={ci} strokeDashoffset={ci*(1-pct)} strokeLinecap="round"
        style={{transition:"stroke-dashoffset .4s"}}/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      <div style={{fontSize:14,fontWeight:800,color:col}}>{Math.round(v)}</div>

    </div>
  </div>;
};

// LOCK
function Lock({onUnlock}){
  const [pw,setPw]=useState(""),[err,setErr]=useState(false),[shake,setShake]=useState(false);
  const try_=()=>{
    if(pw===PW){onUnlock();}
    else{setErr(true);setShake(true);setTimeout(()=>setShake(false),500);setTimeout(()=>setErr(false),2500);setPw("");}
  };
  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{width:"100%",maxWidth:340,animation:"fadeUp .6s ease both"}}>
      <div style={{textAlign:"center",marginBottom:36}}>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:56,lineHeight:.9,color:C.tx,letterSpacing:"-0.02em"}}>NR</div>
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:C.mt,letterSpacing:"0.22em",marginTop:6}}>NICOLASROMIG.DE</div>
      </div>
      <div style={{background:C.bg2,border:`1px solid ${err?"#ff475750":C.ln2}`,borderRadius:14,padding:26,transition:"border .2s",transform:shake?"translateX(-5px)":"none"}}>
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:C.mt,letterSpacing:"0.12em",marginBottom:14}}>🔒 PERSÖNLICHER BEREICH</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&try_()}
          placeholder="Passwort..." autoFocus
          style={{width:"100%",padding:"11px 14px",borderRadius:9,background:"#131820",border:`1px solid ${err?"#ff4757":C.sb}`,
            color:C.tx,fontSize:13,fontFamily:"'DM Mono',monospace",marginBottom:10,boxSizing:"border-box",transition:"border .2s"}}/>
        <button onClick={try_} style={{width:"100%",padding:"11px",borderRadius:9,border:"none",
          background:C.ac,color:"#000",fontSize:13,fontWeight:800,letterSpacing:"0.05em",transition:"opacity .15s"}}
          onMouseEnter={e=>e.target.style.opacity=".8"} onMouseLeave={e=>e.target.style.opacity="1"}>
          ZUGANG FREISCHALTEN
        </button>
        {err&&<div style={{fontSize:11,color:"#ff4757",textAlign:"center",marginTop:9,fontFamily:"'DM Mono',monospace"}}>Falsches Passwort</div>}
      </div>
      <div style={{marginTop:18,display:"flex",flexDirection:"column",gap:8}}>
        <a href="https://www.linkedin.com/in/nicolasromig" target="_blank"
          style={{display:"flex",alignItems:"center",gap:11,padding:"11px 15px",background:C.bg2,border:`1px solid ${C.ln}`,
            borderRadius:9,textDecoration:"none",color:C.tx,fontSize:13,fontWeight:600}}>
          <span>💼</span>LinkedIn<span style={{marginLeft:"auto",color:C.mt}}>→</span>
        </a>
      </div>
    </div>
  </div>;
}

        ["💤","HRV < 25 ms = leichter Tag, kein Hochintensitätstraining"],
        ["👣","Schritte: Ziel 9.000/Tag – Ruhetage aktiver halten"],
        ["⚖️","+1 kg seit Jan = wahrscheinlich Muskelaufbau ✅"]
      ].map(([ic,tx],i)=>(
        <div key={i} style={{display:"flex",gap:8,padding:"5px 0",borderBottom:i<3?"1px solid #1e293b":"none",fontSize:12,color:"#94a3b8"}}>
          <span>{ic}</span>{tx}
        </div>
      ))}
    </div>
  </div>;
}

// TRAINING
function Training(){
  const [act,setAct]=useState("Upper A"),[chk,setChk]=useState({}),[sub,setSub]=useState("session");
  const sess=PLAN[act];
  const tog=(n,si)=>{const k=`${act}|${n}|${si}`;setChk(p=>({...p,[k]:!p[k]}));};
  return <div>
    <div style={{display:"flex",gap:4,marginBottom:14,background:C.bg2,borderRadius:8,padding:4,border:`1px solid ${C.ln}`}}>
      {["session","woche"].map(t=>(
        <button key={t} onClick={()=>setSub(t)} style={{flex:1,padding:"7px",borderRadius:6,border:"none",
          background:sub===t?C.tx:"transparent",color:sub===t?"#000":C.mt,fontSize:12,fontWeight:600,transition:"all .15s"}}>
          {t==="session"?"Session":"Wochenplan"}
        </button>
      ))}
    </div>
    {sub==="session"&&<>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:14}}>
        {Object.entries(PLAN).map(([n,d])=>(
          <button key={n} onClick={()=>setAct(n)} style={{padding:"9px 11px",borderRadius:9,border:"none",textAlign:"left",
            background:act===n?`${d.color}14`:C.bg2,outline:act===n?`1.5px solid ${d.color}`:`1.5px solid ${C.ln}`,transition:"all .15s"}}>
            <div style={{fontSize:12,fontWeight:700,color:act===n?d.color:"#94a3b8"}}>{n}</div>
            <div style={{fontSize:10,color:C.mt,marginTop:1}}>{d.focus}</div>
          </button>
        ))}
      </div>
      <div style={{background:`${sess.color}07`,border:`1px solid ${sess.color}22`,borderRadius:9,padding:"9px 13px",marginBottom:12,fontSize:12,color:"#94a3b8"}}>
        💡 {sess.note}
      </div>
      {sess.ex.map((ex,ei)=>{
        const arr=Array.from({length:ex.s}),done=arr.filter((_,si)=>chk[`${act}|${ex.n}|${si}`]).length;
        return <div key={ei} style={{background:ex.pri?`${sess.color}06`:C.bg2,border:`1px solid ${ex.pri?sess.color+"35":C.ln}`,borderRadius:9,padding:"10px 12px",marginBottom:6}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:ex.pri?sess.color:C.tx}}>{ex.n}</div>
              <div style={{fontSize:11,color:C.mt,marginTop:1}}>{ex.s} Sätze · {ex.r} Wdh.{ex.note?` · ${ex.note}`:""}</div>
            </div>
            <div style={{fontSize:11,fontWeight:700,color:done===ex.s?C.gr:C.mt}}>{done}/{ex.s}</div>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {arr.map((_,si)=>{
              const d=chk[`${act}|${ex.n}|${si}`];
              return <button key={si} onClick={()=>tog(ex.n,si)} style={{
                width:29,height:29,borderRadius:6,border:"none",
                background:d?sess.color:"#1e293b",color:d?"#000":C.mt,fontSize:11,fontWeight:700,transition:"all .15s"}}>
                {d?"✓":si+1}</button>;
            })}
          </div>
        </div>;
      })}
      <button onClick={()=>setChk({})} style={{width:"100%",marginTop:6,padding:"8px",borderRadius:7,border:`1px solid ${C.ln}`,background:"transparent",color:C.mt,fontSize:12}}>
        Sätze zurücksetzen
      </button>
    </>}
    {sub==="woche"&&<>
      {WEEK.map((d,i)=>(
        <div key={i} style={{display:"flex",gap:11,alignItems:"center",padding:"10px 12px",marginBottom:5,borderRadius:9,
          background:d.r?"#0a0d14":C.bg2,border:`1px solid ${d.r?C.ln:(PLAN[d.s]?.color||C.ln)+"35"}`}}>
          <div style={{width:33,height:33,borderRadius:7,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:12,fontWeight:800,background:d.r?"#1e293b":`${PLAN[d.s]?.color}18`,color:d.r?C.mt:PLAN[d.s]?.color}}>{d.d}</div>
          <div style={{flex:1}}>
            {d.r?<div style={{fontSize:12,color:C.mt}}>{d.note}</div>
              :<><div style={{fontSize:13,fontWeight:600,color:PLAN[d.s]?.color}}>{d.s}</div>
                <div style={{fontSize:11,color:C.mt}}>{PLAN[d.s]?.focus}</div></>}
          </div>
        </div>
      ))}
      <div style={{marginTop:12,background:C.bg2,border:`1px solid ${C.ln}`,borderRadius:10,padding:"13px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#94a3b8",marginBottom:9}}>⚡ Klimmzug-Progression</div>
        {[["Jetzt","3–5 Wdh. × 4 Sätze","🟡"],["Woche 4","5–6 Wdh. × 4 Sätze","🎯"],["Woche 8","3×8 sauber","🏆"],["Woche 12","3×8 + Gewichtsgürtel","🚀"]].map(([w,g,ic],i)=>(
          <div key={i} style={{display:"flex",gap:9,alignItems:"center",padding:"5px 0",borderBottom:i<3?"1px solid #1e293b":"none"}}>
            <div style={{fontSize:10,minWidth:52,color:C.mt,fontFamily:"'DM Mono',monospace"}}>{w}</div>
            <div style={{flex:1,fontSize:12,color:"#94a3b8"}}>{g}</div>
            <div>{ic}</div>
          </div>
        ))}
      </div>
    </>}
  </div>;
}

// MEALS
function MealsTab(){
  const [sub,setSub]=useState("tracker"),[open,setOpen]=useState(null),[oi,setOi]=useState({});
  const [log,setLog]=useState([]),[search,setSearch]=useState(""),[sel,setSel]=useState(null),[grams,setGrams]=useState("");
  const [done,setDone]=useState({});
  const tot=log.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0});
  const filt=search.length>1?FOODS.filter(f=>f.n.toLowerCase().includes(search.toLowerCase())):[];
  const add=()=>{
    if(!sel||!grams)return;const g=parseFloat(grams);if(isNaN(g)||g<=0)return;
    const m=g/100;
    setLog([...log,{id:Date.now(),n:sel.n,g,k:Math.round(sel.k*m),p:Math.round(sel.p*m*10)/10,c:Math.round(sel.c*m*10)/10,f:Math.round(sel.f*m*10)/10}]);
    setSel(null);setSearch("");setGrams("");
  };
  return <div>
    <div style={{display:"flex",gap:4,marginBottom:14,background:C.bg2,borderRadius:8,padding:4,border:`1px solid ${C.ln}`}}>
      {[["tracker","📊 Tracker"],["plan","🍽️ Tagesplan"],["prep","🥡 Meal Prep"]].map(([t,l])=>(
        <button key={t} onClick={()=>setSub(t)} style={{flex:1,padding:"6px 4px",borderRadius:6,border:"none",
          background:sub===t?C.tx:"transparent",color:sub===t?"#000":C.mt,fontSize:10,fontWeight:600,transition:"all .15s"}}>{l}</button>
      ))}
    </div>
    {sub==="tracker"&&<>
      <div style={{display:"flex",gap:11,alignItems:"center",background:C.bg2,border:`1px solid ${C.ln}`,borderRadius:11,padding:"11px 13px",marginBottom:12}}>
        <Ring v={Math.round(tot.k)} g={GOALS.k}/>
        <div style={{flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
            <span style={{fontSize:11,color:C.mt}}>Rest heute</span>
            <span style={{fontSize:12,fontWeight:700,color:tot.k>GOALS.k?"#fb923c":C.gr}}>{Math.max(0,GOALS.k-Math.round(tot.k))} kcal</span>
          </div>
          <MBar l="Protein" v={tot.p} g={GOALS.p} col={C.bl}/>
          <MBar l="Kohlenhydrate" v={tot.c} g={GOALS.c} col={C.pu}/>
          <MBar l="Fett" v={tot.f} g={GOALS.f} col={C.or}/>
        </div>
      </div>
      <div style={{background:C.bg2,border:`1px solid ${C.ln}`,borderRadius:11,padding:"11px 13px",marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:"#94a3b8",marginBottom:7}}>+ Hinzufügen</div>
        <input value={search} onChange={e=>{setSearch(e.target.value);setSel(null);}} placeholder="Suchen z.B. 'Hähnchen'..."
          style={{width:"100%",padding:"8px 11px",borderRadius:7,background:"#1e293b",border:`1px solid ${C.sb}`,color:C.tx,fontSize:12,boxSizing:"border-box"}}/>
        {filt.length>0&&!sel&&<div style={{marginTop:4,background:"#1e293b",borderRadius:7,border:`1px solid ${C.sb}`,overflow:"hidden"}}>
          {filt.slice(0,5).map((f,i)=>(
            <div key={i} onClick={()=>{setSel(f);setSearch(f.n);}} style={{padding:"7px 11px",cursor:"pointer",fontSize:12,color:"#94a3b8",
              borderBottom:"1px solid #0f172a",display:"flex",justifyContent:"space-between"}}
              onMouseEnter={e=>e.currentTarget.style.background="#334155"} onMouseLeave={e=>e.currentTarget.style.background=""}>
              <span>{f.n}</span><span style={{color:C.mt,fontSize:11}}>{f.k} kcal · {f.p}g P</span>
            </div>
          ))}
        </div>}
        {sel&&<div style={{marginTop:7,display:"flex",gap:5,alignItems:"center"}}>
          <div style={{flex:1,fontSize:11,color:C.bl,background:"#60a5fa10",padding:"5px 9px",borderRadius:6}}>✓ {sel.n}</div>
          <input value={grams} onChange={e=>setGrams(e.target.value)} placeholder="g" type="number"
            style={{width:65,padding:"5px 8px",borderRadius:6,background:"#1e293b",border:`1px solid ${C.sb}`,color:C.tx,fontSize:12}}/>
          <button onClick={add} style={{padding:"5px 13px",borderRadius:6,border:"none",background:C.bl,color:"#000",fontSize:12,fontWeight:700}}>+</button>
        </div>}
      </div>
      {log.length===0?<div style={{textAlign:"center",color:C.mt,fontSize:13,padding:"22px 0"}}>Noch nichts geloggt 🍽️</div>
        :log.map((e,i)=>(
          <div key={e.id} style={{display:"flex",gap:9,alignItems:"center",padding:"8px 11px",marginBottom:5,background:C.bg2,border:`1px solid ${C.ln}`,borderRadius:8}}>
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:C.tx}}>{e.n} <span style={{color:C.mt,fontSize:10}}>({e.g}g)</span></div>
              <div style={{fontSize:10,color:C.mt,marginTop:1}}>
                <span style={{color:C.bl}}>{e.p}g P</span> · <span style={{color:C.pu}}>{e.c}g K</span> · <span style={{color:C.or}}>{e.f}g F</span>
              </div>
            </div>
            <div style={{fontSize:12,fontWeight:700,color:"#94a3b8"}}>{e.k} kcal</div>
            <button onClick={()=>setLog(log.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:C.mt,fontSize:17,padding:0}}>×</button>
          </div>
        ))}
    </>}
    {sub==="plan"&&MEALS.map((meal,mi)=>{
      const idx=oi[mi]||0,opt=meal.opts[idx],isOpen=open===mi;
      return <div key={mi} style={{marginBottom:7}}>
        <button onClick={()=>setOpen(isOpen?null:mi)} style={{
          width:"100%",background:isOpen?"#0f1e35":C.bg2,border:`1px solid ${isOpen?C.bl+"45":C.ln}`,
          borderRadius:isOpen?"9px 9px 0 0":9,padding:"10px 12px",cursor:"pointer",textAlign:"left",
          display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:34,height:34,borderRadius:8,background:"#1e293b",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>{meal.ic}</div>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:7,alignItems:"center"}}>
              <span style={{fontSize:13,fontWeight:700,color:C.tx}}>{meal.l}</span>
              <span style={{fontSize:10,padding:"2px 6px",borderRadius:9,background:"#1e293b",color:C.bl,fontFamily:"'DM Mono',monospace"}}>{meal.t}</span>
            </div>
            <div style={{fontSize:11,color:C.mt,marginTop:1}}>{opt.n}</div>
          </div>
          <div style={{fontSize:12,fontWeight:700,color:"#94a3b8"}}>{meal.kcal} kcal</div>
        </button>
        {isOpen&&<div style={{background:"#0a1628",border:"1px solid #1e3a5f",borderTop:"none",borderRadius:"0 0 9px 9px",padding:12}}>
          <div style={{display:"flex",gap:5,marginBottom:9}}>
            {meal.opts.map((o,oi2)=>(
              <button key={oi2} onClick={()=>setOi({...oi,[mi]:oi2})} style={{
                padding:"3px 11px",borderRadius:18,fontSize:11,border:"none",cursor:"pointer",
                background:idx===oi2?C.bl:"#1e293b",color:idx===oi2?"#000":C.mt,fontWeight:idx===oi2?700:400}}>{o.n}</button>
            ))}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:9}}>
            {opt.ing.map((ig,i)=><span key={i} style={{fontSize:11,padding:"3px 7px",background:"#1e293b",borderRadius:5,color:"#94a3b8"}}>{ig}</span>)}
          </div>
          <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.6}}>{opt.prep}</div>
          {opt.nj&&<div style={{marginTop:7,background:"#0f2a1a",border:"1px solid #14532d30",borderRadius:7,padding:"6px 10px",fontSize:11,color:C.gr,display:"flex",gap:7}}>
            <span>🥷</span><span><b>Ninja:</b> {opt.nj}</span>
          </div>}
          <div style={{marginTop:7,fontSize:10,color:C.mt,fontFamily:"'DM Mono',monospace"}}>{opt.m}</div>
        </div>}
      </div>;
    })}
    {sub==="prep"&&<>
      <div style={{background:"#0d2010",border:"1px solid #14532d",borderRadius:9,padding:"9px 12px",marginBottom:12,fontSize:12,color:"#86efac",lineHeight:1.6}}>
        🥷 Ninja Batch · ~90 Min · reicht 5 Tage<br/><span style={{color:C.mt}}>Schritte 1 & 2 gleichzeitig starten!</span>
      </div>
      {PREP.map((step,i)=>{
        const dk=done[i];
        return <div key={i} style={{background:dk?"#0a1a0a":C.bg2,border:`1px solid ${dk?"#14532d":C.ln}`,borderRadius:9,padding:"10px 12px",marginBottom:6,opacity:dk?.65:1,transition:"all .2s"}}>
          <div style={{display:"flex",gap:9,alignItems:"flex-start"}}>
            <button onClick={()=>setDone({...done,[i]:!dk})} style={{
              width:30,height:30,borderRadius:7,border:"none",flexShrink:0,
              background:dk?"#14532d":"#1e293b",color:dk?C.gr:C.mt,fontSize:dk?13:16,
              display:"flex",alignItems:"center",justifyContent:"center"}}>{dk?"✓":step.ic}</button>
            <div style={{flex:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:12,fontWeight:700,color:dk?C.mt:C.tx}}>{step.i}. {step.title}</div>
                <span style={{fontSize:10,padding:"2px 6px",borderRadius:5,background:`${step.c}14`,color:step.c}}>{step.method}</span>
              </div>
              <div style={{fontSize:10,color:C.mt,marginTop:1}}>{step.qty}</div>
              <div style={{marginTop:5,background:"#0f2a1a",borderRadius:5,padding:"4px 8px",fontSize:11,color:C.gr}}>🥷 {step.set}</div>
              <div style={{fontSize:11,color:"#64748b",marginTop:4,lineHeight:1.5}}>💡 {step.tip}</div>
            </div>
          </div>
        </div>;
      })}
    </>}
  </div>;
}

// SUPPS
function Supps(){
  const [train,setTrain]=useState(true);
  return <div>
    <div style={{display:"flex",gap:0,marginBottom:14,background:C.bg2,borderRadius:8,padding:4,border:`1px solid ${C.ln}`}}>
      {[[true,"🏋️ Trainingstag"],[false,"😴 Ruhetag"]].map(([v,l])=>(
        <button key={String(v)} onClick={()=>setTrain(v)} style={{flex:1,padding:"7px",border:"none",cursor:"pointer",
          borderRadius:6,fontSize:12,fontWeight:600,background:train===v?C.bl:"transparent",
          color:train===v?"#000":C.mt,transition:"all .15s"}}>{l}</button>
      ))}
    </div>
    <div style={{background:C.bg2,border:`1px solid ${C.ln}`,borderRadius:10,padding:"12px",marginBottom:13}}>
      <div style={{fontSize:10,fontWeight:700,color:C.mt,marginBottom:9,textTransform:"uppercase",letterSpacing:"0.1em"}}>Tagesablauf</div>
      {[
        {t:"07:30",items:["Vitamin D3 + K2","Omega-3"],note:"mit Frühstück"},
        ...(train?[{t:"17:00",items:["5g Kreatin","Pre-Workout Snack"],note:"Pre-Workout"}]:[{t:"12:00",items:["5g Kreatin"],note:"mit Mittagessen"}]),
        ...(train?[{t:"19:15",items:["30g Whey (falls nötig)"],note:"Post-Training"}]:[]),
        {t:"21:00",items:["Magnesium Glycinat 300mg","Zink 15mg"],note:"vor dem Schlafen"},
      ].map((sl,i,arr)=>(
        <div key={i} style={{display:"flex",gap:9,alignItems:"flex-start",padding:"6px 0",borderBottom:i<arr.length-1?"1px solid #1e293b":"none"}}>
          <div style={{fontSize:11,color:C.bl,fontFamily:"'DM Mono',monospace",minWidth:38,fontWeight:700,marginTop:1}}>{sl.t}</div>
          <div><div style={{fontSize:10,color:C.mt,marginBottom:2}}>{sl.note}</div>
            {sl.items.map((it,j)=><div key={j} style={{fontSize:12,color:"#94a3b8"}}>→ {it}</div>)}
          </div>
        </div>
      ))}
    </div>
    {SUPPS.map((sup,i)=>(
      <div key={i} style={{background:C.bg2,border:`1px solid ${sup.c}22`,borderRadius:9,padding:"10px 12px",marginBottom:6}}>
        <div style={{display:"flex",gap:9,alignItems:"flex-start"}}>
          <div style={{width:34,height:34,borderRadius:7,flexShrink:0,background:`${sup.c}14`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{sup.ic}</div>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3}}>
              <span style={{fontSize:13,fontWeight:700,color:C.tx}}>{sup.n}</span>
              <span style={{fontSize:9,padding:"2px 5px",borderRadius:7,background:`${sup.c}14`,color:sup.c,fontWeight:700}}>{sup.p}</span>
            </div>
            <div style={{fontSize:11,color:sup.c,marginBottom:3}}>{sup.d} · {train?sup.tr:sup.re}</div>
            <div style={{fontSize:11,color:"#64748b",lineHeight:1.5}}>{sup.w}</div>
          </div>
        </div>
      </div>
    ))}
  </div>;
}

// MAIN APP
function App(){
  const [unlocked,setUnlocked]=useState(()=>sessionStorage.getItem("nr_ok")==="1");
  const [tab,setTab]=useState("dashboard");
  const unlock=()=>{sessionStorage.setItem("nr_ok","1");setUnlocked(true);};
  const lock=()=>{sessionStorage.removeItem("nr_ok");setUnlocked(false);};
  if(!unlocked)return <Lock onUnlock={unlock}/>;
  const tabs=[{id:"dashboard",ic:"📊",l:"Dashboard"},{id:"training",ic:"🏋️",l:"Training"},{id:"meals",ic:"🥗",l:"Ernährung"},{id:"supps",ic:"💊",l:"Supplements"}];
  return <div style={{maxWidth:640,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <div style={{padding:"18px 18px 0",background:"linear-gradient(180deg,#0d1420 0%,#090b0f 100%)",flexShrink:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
        <div>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:C.mt,letterSpacing:"0.2em",marginBottom:3}}>NICOLASROMIG.DE · PRIVAT</div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:28,lineHeight:.92,color:C.tx,letterSpacing:"-0.02em"}}>
            Fitness<br/><em style={{fontStyle:"italic",color:C.ac}}>Hub</em>
          </div>
        </div>
        <button onClick={lock} style={{padding:"5px 11px",borderRadius:7,border:`1px solid ${C.ln}`,background:"transparent",color:C.mt,fontSize:10,fontFamily:"'DM Mono',monospace",marginTop:4}}>
          🔒 Sperren
        </button>
      </div>
      <div style={{display:"flex",gap:1,borderBottom:`1px solid ${C.ln}`}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            flex:1,padding:"7px 3px",border:"none",cursor:"pointer",background:"none",
            fontSize:9,fontWeight:600,display:"flex",flexDirection:"column",alignItems:"center",gap:2,
            color:tab===t.id?C.tx:C.mt,
            borderBottom:tab===t.id?`2px solid ${C.ac}`:"2px solid transparent",
            letterSpacing:"0.03em",transition:"all .15s"}}>
            <span style={{fontSize:17}}>{t.ic}</span>{t.l}
          </button>
        ))}
      </div>
    </div>
    <div style={{flex:1,padding:"16px 18px 40px",overflowY:"auto"}}>
      {tab==="dashboard"&&<Dashboard/>}
      {tab==="training"&&<Training/>}
      {tab==="meals"&&<MealsTab/>}
      {tab==="supps"&&<Supps/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
